# Entwicklungsumgebung mit Docker.
#
# Nur die Abhängigkeiten (Postgres und Keycloak), die App läuft dann z. B. in der IDE:
#   docker compose up -d
#   .\mvnw.cmd -pl kickertool-bootstrap spring-boot:run
#
# Alles zusammen, die App als Container (wird dafür gebaut):
#   docker compose --profile app up -d --build
#   -> Swagger UI: http://localhost:8080/swagger-ui.html, Login-Beispiel: anna / anna
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kickertool
      POSTGRES_USER: kickertool
      POSTGRES_PASSWORD: kickertool
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kickertool"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_HTTP_PORT: 8180
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8180:8180"
    volumes:
      - ./docker/keycloak/kickertool-realm.json:/opt/keycloak/data/import/kickertool-realm.json:ro

  app:
    profiles: ["app"]
    build: .
    image: kickertool:0.1.0-SNAPSHOT
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      KICKERTOOL_DB_URL: jdbc:postgresql://postgres:5432/kickertool
      KICKERTOOL_DB_USER: kickertool
      KICKERTOOL_DB_PASSWORD: kickertool
      # Der Aussteller im Token ist die Adresse, unter der der Browser Keycloak erreicht.
      KICKERTOOL_OIDC_ISSUER_URI: http://localhost:8180/realms/kickertool
      # Im Container ist Keycloak aber unter seinem Dienstnamen erreichbar, von dort kommen die Schlüssel.
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8180/realms/kickertool/protocol/openid-connect/certs
      # Eine UI im Entwicklungsmodus auf einem lokalen Port darf die API aufrufen.
      KICKERTOOL_CORS_ALLOWED_ORIGINS: "${KICKERTOOL_CORS_ALLOWED_ORIGINS:-http://localhost:[*],http://127.0.0.1:[*]}"
    ports:
      - "8080:8080"

volumes:
  postgres-data:
