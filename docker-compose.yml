# Lokale Entwicklungsumgebung: PostgreSQL und Keycloak als OIDC-Provider.
# Starten:  docker compose up -d
# Danach:   .\mvnw.cmd -pl kickertool-bootstrap spring-boot:run
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kickertool
      POSTGRES_USER: kickertool
      POSTGRES_PASSWORD: kickertool
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kickertool"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_HTTP_PORT: 8180
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8180:8180"
    volumes:
      - ./docker/keycloak/kickertool-realm.json:/opt/keycloak/data/import/kickertool-realm.json:ro

volumes:
  postgres-data:
