{{- /* Passwort für eine eigene Datenbank (nur wenn keine eigene Postgres-Instanz und kein vorhandenes Secret) */}}
{{- if and (not .Values.postgresql.enabled) (not .Values.database.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kickertool.dbSecretName" . }}
  labels:
    {{- include "kickertool.labels" (dict "ctx" . "component" "app") | nindent 4 }}
type: Opaque
data:
  password: {{ required "database.password oder database.existingSecret ist nötig, wenn postgresql.enabled=false" .Values.database.password | b64enc }}
{{- end }}
