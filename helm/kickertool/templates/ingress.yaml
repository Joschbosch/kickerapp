{{- if .Values.ingress.enabled }}
{{- $host := include "kickertool.ingressHost" . }}
{{- $keycloakHost := include "kickertool.ingressKeycloakHost" . }}
{{- if not $host }}
{{- fail "ingress.host (oder global.host) ist nötig, wenn ingress.enabled=true" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "kickertool.fullname" . }}
  labels:
    {{- include "kickertool.labels" (dict "ctx" . "component" "app") | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with (default (default dict .Values.global).ingressClassName .Values.ingress.className) }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with (include "kickertool.ingressTls" .) }}
  tls:
    {{- . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          {{- range .Values.ingress.paths }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "kickertool.fullname" $ }}
                port:
                  name: http
          {{- end }}
    {{- if and .Values.keycloak.enabled $keycloakHost }}
    - host: {{ $keycloakHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "kickertool.keycloakName" . }}
                port:
                  name: http
    {{- end }}
{{- end }}
